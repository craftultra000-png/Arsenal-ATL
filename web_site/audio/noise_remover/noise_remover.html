<div class="nrem-page">

    <!-- ── هيدر ── -->
    <div class="nrem-header">
        <div class="nrem-header-icon">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 18V5l12-2v13"></path>
                <circle cx="6" cy="18" r="3"></circle>
                <circle cx="18" cy="16" r="3"></circle>
                <line x1="2" y1="2" x2="22" y2="22"></line>
            </svg>
        </div>
        <div>
            <h1 class="nrem-title" data-lang="nrem_title">مزيل الضوضاء</h1>
            <p class="nrem-sub" data-lang="nrem_sub">إزالة الضوضاء الصوتية المحيطة وتنقية الصوت بالذكاء الاصطناعي.</p>
        </div>
    </div>

    <!-- ── رفع الملف ── -->
    <div class="nrem-section">
        <div class="nrem-section-label" data-lang="nrem_section_file">الملف الصوتي</div>
        <div class="nrem-input-row">
            <!-- زر رفع الملف 1:1 -->
            <div class="nrem-card nrem-input-btn" id="dropZone" onclick="document.getElementById('fileInput').click()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 18V5l12-2v13"></path>
                    <circle cx="6" cy="18" r="3"></circle>
                    <circle cx="18" cy="16" r="3"></circle>
                </svg>
                <span class="nrem-input-label" id="dropText" data-lang="nrem_btn_upload">رفع ملف</span>
                <span class="nrem-drop-hint">WAV · MP3 · OGG · FLAC · M4A</span>
                <input type="file" id="fileInput" accept="audio/*" hidden>
            </div>
            <!-- زر تسجيل الصوت 1:1 -->
            <div class="nrem-card nrem-input-btn nrem-record-btn" id="recordBtn">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="23"></line>
                    <line x1="8" y1="23" x2="16" y2="23"></line>
                </svg>
                <span class="nrem-input-label" id="recordLabel" data-lang="nrem_btn_record">تسجيل</span>
                <span class="nrem-drop-hint" id="recordHint" data-lang="nrem_record_start">اضغط للبدء</span>
            </div>
        </div>
        <div id="startWrap" style="display:none; margin-top:12px;">
            <button class="nrem-btn nrem-btn-success" id="startBtn" style="width:100%;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <span data-lang="nrem_btn_start">بدء المعالجة</span>
            </button>
        </div>
    </div>

    <!-- ── تحميل النموذج ── -->
    <div class="nrem-section" id="modelSection" hidden>
        <div class="nrem-card nrem-model-card">
            <div class="nrem-ctrl-row">
                <span class="nrem-ctrl-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <span data-lang="nrem_model_loading">جاري تحميل نموذج الذكاء الاصطناعي...</span>
                </span>
                <span class="nrem-ctrl-val" id="modelPct">0%</span>
            </div>
            <div class="nrem-progress-track">
                <div class="nrem-progress-fill" id="modelBar" style="width:0%"></div>
            </div>
        </div>
    </div>

    <!-- ── منطقة المعالجة ── -->
    <div class="nrem-section" id="statusArea" hidden>

        <!-- معلومات الملف -->
        <div class="nrem-file-meta" id="fileMeta"></div>

        <!-- شريط التقدم -->
        <div class="nrem-card nrem-progress-card" id="progressWrap" hidden>
            <div class="nrem-progress-steps" id="progressSteps">
                <span class="nrem-pstep" id="pstep-model" data-lang="nrem_step_model">تحميل النموذج</span>
                <span class="nrem-pstep" id="pstep-infer" data-lang="nrem_step_infer">معالجة الإطارات</span>
                <span class="nrem-pstep" id="pstep-encode" data-lang="nrem_step_encode">تجميع الملف</span>
            </div>
            <div class="nrem-progress-track">
                <div class="nrem-progress-fill" id="barFill"></div>
            </div>
            <p class="nrem-progress-label" id="progressLabel" data-lang="nrem_progress_init">جارٍ التهيئة…</p>
        </div>

        <!-- النتائج -->
        <div id="players" hidden>

            <!-- تبديل الأصلي / المنقى -->
            <div class="nrem-tabs">
                <button class="nrem-tab" id="tabOrig" data-lang="nrem_tab_orig">الأصلي</button>
                <button class="nrem-tab active" id="tabClean" data-lang="nrem_tab_clean">المُنقّى</button>
            </div>

            <!-- زر التشغيل -->
            <button class="nrem-btn nrem-btn-play" id="playBtn">
                <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 3 19 12 5 21 5 3"></polygon>
                </svg>
                <span data-lang="nrem_play">تشغيل</span>
            </button>

            <!-- التايم لاين -->
            <div class="nrem-timeline" id="progressWrapper">
                <span id="currentTimeText" class="nrem-time">00:00</span>
                <div class="nrem-progress-track nrem-timeline-track" id="progressTrack">
                    <div class="nrem-progress-fill" id="progressFill"></div>
                    <div class="nrem-progress-thumb" id="progressThumb"></div>
                </div>
                <span id="totalTimeText" class="nrem-time">00:00</span>
            </div>

        </div>

        <!-- تأثير البودكاست -->
        <div class="nrem-podcast-controls" id="podcastControls" hidden>
            <div class="nrem-ctrl-row">
                <span class="nrem-ctrl-label">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
                    <span data-lang="nrem_podcast">تأثير البودكاست الاحترافي</span>
                </span>
                <button class="nrem-toggle-btn" id="podcastToggle" aria-pressed="false">
                    <span class="nrem-toggle-track">
                        <span class="nrem-toggle-thumb"></span>
                    </span>
                    <span class="nrem-toggle-text" data-lang="nrem_off">إيقاف</span>
                </button>
            </div>
        </div>

        <!-- أزرار التصدير -->
        <div class="nrem-action-row" id="actionRow" hidden>
            <button class="nrem-btn nrem-btn-success" id="downloadBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span data-lang="nrem_download">تحميل WAV</span>
            </button>
            <button class="nrem-btn nrem-btn-secondary" id="resetBtn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="1 4 1 10 7 10"></polyline>
                    <path d="M3.51 15a9 9 0 1 0 .49-3.96"></path>
                </svg>
                <span data-lang="nrem_reset">ملف آخر</span>
            </button>
        </div>

    </div>

</div>
